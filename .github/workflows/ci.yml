name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Nenhum segredo com prefixo público (AD-12)
        run: |
          if grep -rnE "NEXT_PUBLIC_[A-Z0-9_]*SECRET" src .env.example next.config.ts; then
            echo "Segredo com prefixo NEXT_PUBLIC_ encontrado."
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  supabase:
    name: Supabase local sobe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase --version
      - run: npx supabase start
      - run: npx supabase status
      - name: Parar o Supabase local
        if: always()
        run: npx supabase stop --no-backup
