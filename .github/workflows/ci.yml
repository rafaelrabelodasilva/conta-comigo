name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Nenhum segredo com prefixo público (AD-12)
        run: |
          if grep -rnE "NEXT_PUBLIC_[A-Z0-9_]*SECRET" src .env.example next.config.ts; then
            echo "Segredo com prefixo NEXT_PUBLIC_ encontrado."
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build com segredo-isca no ambiente
        env:
          # Isca: se o código vazar a chave secreta para o cliente, o grep acha.
          SUPABASE_SECRET_KEY: sb_secret_ci_canary
        run: npm run build
      - name: Nenhum segredo no bundle do cliente (AD-12)
        run: |
          test -d .next/static || { echo ".next/static não existe."; exit 1; }
          # Procura o valor da isca, não o prefixo `sb_secret_`: o supabase-js
          # do navegador traz esse prefixo numa checagem de formato de chave.
          if grep -rnE "SUPABASE_SECRET_KEY|sb_secret_ci_canary" .next/static; then
            echo "Segredo encontrado nos arquivos do cliente."
            exit 1
          fi

  supabase:
    name: Supabase local sobe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase --version
      - run: npx supabase start
      - run: npx supabase status
      - name: Testes de integração (Auth, Responsáveis com RLS e Realtime)
        env:
          INTEGRACAO_SUPABASE: "1"
        run: |
          # Chaves locais do Supabase (não são segredos de produção).
          # O `supabase start` já aplicou as migrações do zero.
          set -a
          eval "$(npx supabase status -o env)"
          set +a
          npx vitest run test/integracao
      - name: Tipos do banco iguais aos gerados (AD-14)
        run: |
          npx supabase gen types typescript --local > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u src/data/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "src/data/database.types.ts difere do gerado. Copie a saída acima (lado +) para o arquivo."
            exit 1
          fi
      - name: Logs do Realtime (só em falha)
        if: failure()
        run: |
          docker ps --format '{{.Names}}' | grep -i realtime | while read -r c; do
            echo "== $c"; docker logs --tail 200 "$c" 2>&1
          done
      - name: Parar o Supabase local
        if: always()
        run: npx supabase stop --no-backup
